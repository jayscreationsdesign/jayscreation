<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadre Personnalisé - Jay's Creations</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #FAF7F2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .image-container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(139, 69, 19, 0.15);
        }

        .background {
            position: absolute;
            inset: 0;
            background: #F5E6D3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Motif décoratif subtil */
        .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            background-image: 
                radial-gradient(circle at 25% 25%, #8B4513 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, #8B4513 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Cadre décoratif central */
        .frame {
            position: relative;
            width: 300px;
            height: 400px;
            border: 3px solid #8B4513;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(250, 247, 242, 0.8);
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.2);
        }

        .inner-frame {
            width: 260px;
            height: 360px;
            border: 2px solid #C8A96E;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(245, 230, 211, 0.5);
        }

        /* Icône élégante - photo */
        .icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        /* Textes */
        .title {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: #8B4513;
            text-align: center;
        }

        .subtitle {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #8B4513;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Éléments décoratifs */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #C8A96E;
        }

        .corner.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="background">
            <div class="pattern"></div>
            
            <!-- Coins décoratifs -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            
            <!-- Cadre principal -->
            <div class="frame">
                <div class="inner-frame">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="#8B4513" stroke-width="2" fill="none"/>
                            <circle cx="8.5" cy="8.5" r="1.5" fill="#8B4513" opacity="0.6"/>
                            <path d="M21 15l-5-5L5 21" stroke="#8B4513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Textes -->
            <div class="title">Cadre Personnalisé</div>
            <div class="subtitle">VOS SOUVENIRS PRÉCIEUX</div>
        </div>
    </div>
</body>
</html>
