<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Décoration Saint-Valentin - Jay's Creations</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #FAF7F2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .image-container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(139, 69, 19, 0.15);
        }

        .background {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #F5E6D3 0%, #E8D5B7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Motif décoratif coeurs */
        .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.06;
            background-image: 
                radial-gradient(circle at 25% 25%, #C8A96E 3px, transparent 3px),
                radial-gradient(circle at 75% 75%, #C8A96E 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #8B4513 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Coeur central */
        .heart-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .heart {
            width: 120px;
            height: 120px;
            position: relative;
            transform: rotate(-45deg);
            background: linear-gradient(135deg, #8B4513 0%, #C8A96E 100%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.3);
        }

        .heart::before,
        .heart::after {
            content: '';
            width: 120px;
            height: 120px;
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B4513 0%, #C8A96E 100%);
        }

        .heart::before {
            top: -60px;
            left: 0;
        }

        .heart::after {
            left: 60px;
            top: 0;
        }

        /* Textes */
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #8B4513;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #8B4513;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Petits coeurs décoratifs */
        .small-heart {
            position: absolute;
            color: #C8A96E;
            font-size: 16px;
            opacity: 0.6;
        }

        .small-heart:nth-child(1) { top: 15%; left: 20%; transform: rotate(-15deg); }
        .small-heart:nth-child(2) { top: 20%; right: 25%; transform: rotate(15deg); }
        .small-heart:nth-child(3) { bottom: 25%; left: 15%; transform: rotate(-10deg); }
        .small-heart:nth-child(4) { bottom: 20%; right: 20%; transform: rotate(10deg); }

        /* Ligne décorative */
        .decoration-line {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #C8A96E, transparent);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="background">
            <div class="pattern"></div>
            
            <!-- Petits coeurs décoratifs -->
            <div class="small-heart">+</div>
            <div class="small-heart">+</div>
            <div class="small-heart">+</div>
            <div class="small-heart">+</div>
            
            <!-- Coeur central -->
            <div class="heart-container">
                <div class="heart"></div>
            </div>
            
            <!-- Textes -->
            <div class="title">Saint-Valentin</div>
            <div class="subtitle">Déclaration d'Amour</div>
            <div class="decoration-line"></div>
        </div>
    </div>
</body>
</html>
