<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Noël Personnalisée - Jay's Creations</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #FAF7F2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .image-container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(139, 69, 19, 0.15);
        }

        .background {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #F5E6D3 0%, #E8D5B7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Motif décoratif flocons de neige */
        .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            background-image: 
                radial-gradient(circle at 20% 20%, #8B4513 2px, transparent 2px),
                radial-gradient(circle at 80% 30%, #8B4513 1px, transparent 1px),
                radial-gradient(circle at 40% 60%, #8B4513 1.5px, transparent 1.5px),
                radial-gradient(circle at 70% 80%, #8B4513 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Carte centrale */
        .card {
            position: relative;
            width: 320px;
            height: 480px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(139, 69, 19, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #C8A96E;
            overflow: hidden;
        }

        .card-header {
            position: absolute;
            top: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #8B4513 0%, #C8A96E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Icône étoile Noël */
        .christmas-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .christmas-icon svg {
            width: 100%;
            height: 100%;
        }

        .card-content {
            position: absolute;
            top: 120px;
            width: 100%;
            height: calc(100% - 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #8B4513;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #8B4513;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Décorations */
        .snowflake {
            position: absolute;
            color: #C8A96E;
            font-size: 20px;
            opacity: 0.6;
        }

        .snowflake:nth-child(1) { top: 10%; left: 15%; }
        .snowflake:nth-child(2) { top: 15%; right: 20%; }
        .snowflake:nth-child(3) { bottom: 20%; left: 10%; }
        .snowflake:nth-child(4) { bottom: 15%; right: 15%; }

        /* Bordure décorative */
        .border-decoration {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #C8A96E, transparent);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="background">
            <div class="pattern"></div>
            
            <!-- Flocons de neige décoratifs -->
            <div class="snowflake">*</div>
            <div class="snowflake">+</div>
            <div class="snowflake">*</div>
            <div class="snowflake">+</div>
            
            <!-- Carte centrale -->
            <div class="card">
                <div class="card-header">
                    <div class="christmas-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L14.09 8.26L20.18 8.63L15.54 12.74L16.91 19.02L12 15.77L7.09 19.02L8.46 12.74L3.82 8.63L9.91 8.26L12 2Z" 
                                fill="white" opacity="0.9"/>
                            <path d="M12 2L14.09 8.26L20.18 8.63L15.54 12.74L16.91 19.02L12 15.77L7.09 19.02L8.46 12.74L3.82 8.63L9.91 8.26L12 2Z" 
                                stroke="white" strokeWidth="1.5" fill="none"/>
                        </svg>
                    </div>
                </div>
                <div class="card-content">
                    <div class="title">Carte de Noël</div>
                    <div class="subtitle">Voeux Chaleureux</div>
                    <div class="border-decoration"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
