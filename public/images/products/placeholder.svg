<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="640" height="640" fill="#E8D5B7"/>
  
  <!-- Cercle de fond -->
  <circle cx="320" cy="280" r="120" fill="#D4C5A8"/>
  
  <!-- Icône appareil photo -->
  <g transform="translate(320, 280)">
    <!-- Corps de l'appareil -->
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#C8A96E" stroke="#B8A068" stroke-width="2"/>
    
    <!-- Objectif -->
    <circle cx="0" cy="-5" r="12" fill="#2C2C2C" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="0" cy="-5" r="8" fill="#E8D5B7"/>
    
    <!-- Viseur -->
    <rect x="-4" y="-9" width="8" height="8" rx="1" fill="none" stroke="#C8A96E" stroke-width="1.5"/>
    
    <!-- Flash -->
    <rect x="25" y="-20" width="8" height="10" rx="2" fill="#F0F0F0" stroke="#D0D0D0" stroke-width="1"/>
    
    <!-- Bouton -->
    <circle cx="0" cy="15" r="4" fill="#F0F0F0" stroke="#D0D0D0" stroke-width="1"/>
  </g>
  
  <!-- Texte -->
  <text x="320" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#C8A96E">
    Image bientôt disponible
  </text>
</svg>
